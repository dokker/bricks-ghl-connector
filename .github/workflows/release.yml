name: Build Release ZIP

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Fails the release when the tag, the plugin header, the version constant
      # and CHANGELOG.md disagree. The plugin's updater reads info.json from
      # releases/latest/download/, which is not rate limited like the REST API.
      - name: Build update info
        run: python3 .github/scripts/build-info.py "$GITHUB_REF_NAME" > info.json

      # git archive honors export-ignore in .gitattributes and puts every file
      # under bricks-ghl-connector/, so WordPress installs it into that folder.
      - name: Create clean ZIP
        run: git archive --format=zip --prefix=bricks-ghl-connector/ -o bricks-ghl-connector.zip HEAD

      - name: Upload to Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            bricks-ghl-connector.zip
            info.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
